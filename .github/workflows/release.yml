name: Publish Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Create flat release ZIP
        run: git archive --format=zip --output=MineFlayer-Control-Web-v0.0.0.0.zip HEAD
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.0.0.0"
          RELEASE_NAME="MineFlayer-Control-Web-v0.0.0.0"
          ASSET="MineFlayer-Control-Web-v0.0.0.0.zip"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi

          gh release create "$TAG" "$ASSET" \
            --title "$RELEASE_NAME" \
            --notes "MineFlayer Control Web self-hosted release. Extract the ZIP contents directly into the server directory. Start with: node index.js" \
            --target "$GITHUB_SHA"
