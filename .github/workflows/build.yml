name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Create flat source ZIP
        run: git archive --format=zip --output=Mineflayer-Control.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: Mineflayer-Control-source
          path: Mineflayer-Control.zip
          if-no-files-found: error
