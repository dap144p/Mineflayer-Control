<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="theme-color" content="#08090b" />
    <title>Mineflayer 3D Viewer</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #viewer { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: #08090b; color: #e5e7eb; font: 12px system-ui, sans-serif; }
      #viewer canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #status { position: fixed; top: 12px; left: 12px; z-index: 2; max-width: calc(100% - 150px); padding: 7px 10px; border: 1px solid #ffffff1c; border-radius: 9px; background: #08090bd9; color: #cbd5e1; backdrop-filter: blur(8px); }
      #camera { position: fixed; top: 12px; right: 12px; z-index: 2; border: 1px solid #ffffff24; border-radius: 9px; background: #111318e8; color: #e5e7eb; padding: 7px 10px; font: inherit; }
    </style>
    <script>
      window.process = window.process || { versions: { node: "22.0.0" }, platform: "browser", env: {} };
    </script>
  </head>
  <body>
    <div id="viewer"></div>
    <div id="status">Menghubungkan viewer…</div>
    <button id="camera" type="button">Kamera: Orbit</button>
    <script type="module" src="./main.js"></script>
  </body>
</html>
